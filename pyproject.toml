[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (common in math/data science)
    "B905",   # zip without strict= (not available in py39)
    "SIM108", # ternary operator (readability preference)
    "UP007",  # X | Y union syntax (requires py310+)
    "RUF013", # implicit Optional (fix requires py310+ union syntax)
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F821", "B018"]  # notebooks: cell imports, cross-cell refs, display expressions

[tool.ruff.format]
quote-style = "double"

[tool.nbqa.addopts]
ruff = ["--extend-ignore=E402,F821,B018"]