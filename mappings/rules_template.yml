      - p: owl:sameAs
        o:
          value: "https://www.wikidata.org/wiki/$(wikidata)"
          type: iri
          condition:
            function: idlab-fn:notEqual
            parameters:
              - [grel:str1, $(wikidata)]
              - [grel:str2, ""]

      - p: rdfs:seeAlso
        o:
          value: "https://en.wikipedia.org/wiki/$(wikipedia)"
          condition:
            function: idlab-fn:notEqual
            parameters:
              - [grel:str1, $(wikipedia)]
              - [grel:str2, ""]

  poiInteraction:
    sources:
      - [trajectory_1.csv~csv]
    s: poi:interaction_$(traj_id)_$(stop_id)
    po:
      - p: a
        o:
          - value: poi:POIInteraction
            condition:
              function: idlab-fn:notEqual
              parameters:
                - [grel:valueParameter, $(poi_ids)]
                - [grel:valueParameter2, "[]"]
      - p: poi:interactsWith
        o:
          - value: poi:pointOfInterest_$(poi_ids)
            condition:
              function: idlab-fn:notEqual
              parameters:
                - [grel:valueParameter, $(poi_ids)]
                - [grel:valueParameter2, "[]"]
      - p: poi:hasDwellTime
        o:
          - value: "PT$(time_spent)S"
            datatype: xsd:duration
            condition:
              function: idlab-fn:notEqual
              parameters:
                - [grel:valueParameter, $(time_spent)]
                - [grel:valueParameter2, ""]
      - p: poi:hasDwellTimeInSeconds
        o:
          - value: $(time_spent)
            datatype: xsd:float
            condition:
              function: idlab-fn:notEqual
              parameters:
                - [grel:valueParameter, $(time_spent)]
                - [grel:valueParameter2, ""]

  person:
    sources:
      - [trajectory_1.csv~csv]
    s: user:$(username)
    po:
      - [a, trajecto:Person]
      - [trajecto:formsTrajectory, trajecto:trajectory_$(traj_id)~iri]
      - [rdfs:label, $(username)]
